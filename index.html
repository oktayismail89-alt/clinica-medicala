<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinica Sănătate Plus — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f4f0; --surface: #ffffff; --surface2: #eeecea;
  --border: rgba(0,0,0,0.07); --border2: rgba(0,0,0,0.12);
  --text: #1a1917; --text2: #6b6a66; --text3: #9b9a96;
  --radius: 10px; --radius-lg: 14px;
  --font: 'DM Sans', sans-serif; --font-mono: 'DM Mono', monospace;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border2);
  padding: 0 1.5rem; height: 58px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.logo { width: 34px; height: 34px; background: var(--text); border-radius: 9px; display: flex; align-items: center; justify-content: center; color: white; font-size: 15px; font-weight: 600; }
.clinic-name { font-size: 15px; font-weight: 600; }
.clinic-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
.ai-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 20px; background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
.ai-dot { width: 6px; height: 6px; border-radius: 50%; background: #16a34a; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.main { max-width: 1280px; margin: 0 auto; padding: 1.5rem; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; }
.stat-label { font-size: 11px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
.stat-value { font-size: 24px; font-weight: 600; color: var(--text); }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }
.cal-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 10px; }
.cal-title { font-size: 16px; font-weight: 600; }
.cal-nav { display: flex; align-items: center; gap: 8px; }
.nav-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.nav-btn:hover { background: var(--surface2); }
.week-label { font-size: 13px; color: var(--text2); min-width: 200px; text-align: center; font-weight: 500; }
.today-btn { font-size: 12px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface); color: var(--text2); cursor: pointer; font-family: var(--font); }
.today-btn:hover { background: var(--surface2); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
.filter-btn { font-size: 12px; padding: 5px 12px; border-radius: 20px; cursor: pointer; border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-family: var(--font); font-weight: 500; display: flex; align-items: center; gap: 5px; }
.filter-btn:hover { background: var(--surface2); }
.filter-btn.active { color: white; border-color: transparent; }
.filter-dot { width: 7px; height: 7px; border-radius: 50%; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1rem; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.cal-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.cal-grid { display: grid; grid-template-columns: 50px repeat(7, minmax(0, 1fr)); gap: 1px; background: var(--border); }
.cal-head { background: var(--surface2); font-size: 11px; color: var(--text2); text-align: center; padding: 8px 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
.cal-head .day-num { font-size: 16px; font-weight: 700; display: block; margin-top: 2px; }
.cal-head.today .day-num { background: var(--text); color: white; width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.time-label { background: var(--surface); font-size: 10px; color: var(--text3); text-align: right; padding: 3px 6px 0 0; height: 40px; display: flex; align-items: flex-start; justify-content: flex-end; font-family: var(--font-mono); }
.cal-cell { background: var(--surface); height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 2px; overflow: hidden; }
.cal-cell:hover { opacity: 0.82; }
.cal-cell.closed { background: var(--bg); cursor: default; opacity: 1; }
.cell-inner { text-align: center; line-height: 1.2; overflow: hidden; width: 100%; padding: 0 2px; }
.cell-booked { font-size: 9px; font-weight: 600; color: white; }
.cell-avail { font-size: 9px; opacity: 0.65; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border2); width: 360px; max-width: 94vw; box-shadow: 0 12px 40px rgba(0,0,0,0.15); overflow: hidden; }
.modal-header { padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
.modal-title { font-size: 14px; font-weight: 600; }
.modal-close { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border2); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--text2); }
.modal-close:hover { background: var(--surface2); }
.modal-doctor { display: flex; align-items: center; gap: 10px; padding: 0.875rem 1.25rem; border-bottom: 1px solid var(--border); }
.doc-avatar { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: white; flex-shrink: 0; }
.doc-name { font-size: 13px; font-weight: 600; }
.doc-spec { font-size: 11px; color: var(--text3); margin-top: 1px; }
.modal-rows { padding: 0.5rem 0; }
.modal-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 1.25rem; font-size: 13px; border-bottom: 1px solid var(--border); }
.modal-row:last-child { border-bottom: none; }
.modal-label { color: var(--text2); }
.modal-value { font-weight: 500; color: var(--text); text-align: right; max-width: 55%; }
.modal-price { font-size: 16px; font-weight: 700; }
.status-pill { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; }
.status-confirmed { background: #dcfce7; color: #166534; }
.modal-footer { padding: 0.875rem 1.25rem; border-top: 1px solid var(--border); }
.modal-btn { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 13px; cursor: pointer; font-family: var(--font); font-weight: 500; }
.modal-btn:hover { filter: brightness(0.96); }
.loading { display: flex; align-items: center; justify-content: center; padding: 3rem; color: var(--text3); font-size: 14px; gap: 10px; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--border2); border-top-color: var(--text2); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-msg { padding: 2rem; text-align: center; color: #dc2626; font-size: 13px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <div class="logo">CS</div>
    <div>
      <div class="clinic-name">Clinica Sănătate Plus</div>
      <div class="clinic-sub">București, Sector 1</div>
    </div>
  </div>
  <div class="ai-badge"><div class="ai-dot"></div>Agent AI activ</div>
</div>
<div class="main">
  <div class="stats">
    <div class="stat"><div class="stat-label">Programări</div><div class="stat-value" id="s1">—</div><div class="stat-sub">săptămâna aceasta</div></div>
    <div class="stat"><div class="stat-label">Sloturi libere</div><div class="stat-value" id="s2">—</div><div class="stat-sub">disponibile</div></div>
    <div class="stat"><div class="stat-label">Venit estimat</div><div class="stat-value" id="s3">—</div><div class="stat-sub">RON săptămâna aceasta</div></div>
    <div class="stat"><div class="stat-label">Ocupare</div><div class="stat-value" id="s4">—</div><div class="stat-sub">grad umplere</div></div>
  </div>
  <div class="cal-toolbar">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="cal-title">Programări săptămânale</span>
      <button class="today-btn" onclick="goToday()">Azi</button>
    </div>
    <div class="cal-nav">
      <button class="nav-btn" onclick="changeWeek(-1)">&#8592;</button>
      <span class="week-label" id="weekLabel"></span>
      <button class="nav-btn" onclick="changeWeek(1)">&#8594;</button>
    </div>
  </div>
  <div class="filters" id="filterBar"></div>
  <div class="legend" id="legendBar"></div>
  <div class="cal-wrap"><div id="calGrid" class="cal-grid"><div class="loading" style="grid-column:1/-1"><div class="spinner"></div> Se încarcă datele...</div></div></div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Detalii programare</span>
      <button class="modal-close" onclick="closeModal()">&#215;</button>
    </div>
    <div id="modalBody"></div>
    <div class="modal-footer"><button class="modal-btn" onclick="closeModal()">Închide</button></div>
  </div>
</div>
<script>
const SB_URL = 'https://bkqdidhmczsfgpzbuviz.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrcWRpZGhtY3pzZmdwemJ1dml6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMjMxMzQsImV4cCI6MjA5NDY5OTEzNH0.GZ8N1yyVCkvgWFVuKaVNhjghY3fKQMzw40T9Amk_HAE';
const MONTHS_S = ['Ian','Feb','Mar','Apr','Mai','Iun','Iul','Aug','Sep','Oct','Nov','Dec'];
const DAYS_S = ['Dum','Lun','Mar','Mie','Joi','Vin','Sâm'];
let weekOffset=0, activeFilter=-1, doctors=[], appointments=[], slots=[];

async function sb(table, params='') {
  const r = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, {
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'}
  });
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

function docColor(name) {
  if(!name) return '#888';
  const n=name.toLowerCase();
  if(n.includes('moldovan')) return '#2563EB';
  if(n.includes('popescu')) return '#DB2777';
  if(n.includes('constantin')) return '#059669';
  if(n.includes('ionescu')) return '#D97706';
  return '#888';
}

function docInitials(name) {
  if(!name) return '??';
  return name.replace('Dr. ','').split(' ').map(p=>p[0]).join('').substring(0,2).toUpperCase();
}

function weekStart(offset) {
  const d=new Date(), dow=d.getDay(), diff=d.getDate()-dow+(dow===0?-6:1);
  d.setDate(diff+offset*7); d.setHours(0,0,0,0); return d;
}

function goToday(){weekOffset=0;loadData();}
function changeWeek(d){weekOffset+=d;loadData();}

async function loadData() {
  document.getElementById('calGrid').innerHTML='<div class="loading" style="grid-column:1/-1"><div class="spinner"></div> Se încarcă...</div>';
  try {
    const ws=weekStart(weekOffset), we=new Date(ws);
    we.setDate(we.getDate()+6);
    const df=ws.toISOString().split('T')[0], dt=we.toISOString().split('T')[0];
    [doctors,appointments,slots]=await Promise.all([
      sb('doctors','select=*&order=specialty.asc'),
      sb('appointments',`select=*,doctors(name,specialty),services(name,price_ron,duration_min)&date=gte.${df}&date=lte.${dt}&order=date.asc,start_time.asc`),
      sb('available_slots',`select=*,doctors(name,specialty)&is_available=eq.true&date=gte.${df}&date=lte.${dt}&order=date.asc,start_time.asc`)
    ]);
    render(ws,we);
  } catch(e) {
    document.getElementById('calGrid').innerHTML=`<div class="error-msg" style="grid-column:1/-1">Eroare: ${e.message}</div>`;
  }
}

function render(ws,we) {
  const wLabel = ws.getDate()+' '+MONTHS_S[ws.getMonth()]+' – '+we.getDate()+' '+MONTHS_S[we.getMonth()]+' '+we.getFullYear();
  document.getElementById('weekLabel').textContent=wLabel;
  const days=Array.from({length:7},(_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d;});
  const revenue=appointments.reduce((s,a)=>s+(a.services?.price_ron||0),0);
  const total=slots.length+appointments.length;
  document.getElementById('s1').textContent=appointments.length;
  document.getElementById('s2').textContent=slots.length;
  document.getElementById('s3').textContent=revenue.toLocaleString('ro-RO');
  document.getElementById('s4').textContent=(total>0?Math.round(appointments.length/total*100):0)+'%';

  const fb=document.getElementById('filterBar');
  fb.innerHTML=`<button class="filter-btn${activeFilter===-1?' active':''}" style="${activeFilter===-1?'background:#1a1917;':''}" data-f="-1">Toți medicii</button>`+
    doctors.map(d=>{const c=docColor(d.name),a=activeFilter===d.id;return`<button class="filter-btn${a?' active':''}" style="${a?'background:'+c+';':''}" data-f="${d.id}"><span class="filter-dot" style="background:${c}"></span>${d.name.replace('Dr. ','')}</button>`;}).join('');
  fb.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{activeFilter=b.dataset.f==='-1'?-1:b.dataset.f;render(ws,we);}));

  document.getElementById('legendBar').innerHTML=doctors.map(d=>`<div class="legend-item"><div class="legend-dot" style="background:${docColor(d.name)}"></div>${d.name} — ${d.specialty}</div>`).join('')+
    `<div class="legend-item"><div class="legend-dot" style="background:var(--border2)"></div>Slot disponibil</div>`;

  const allHours=new Set();
  appointments.forEach(a=>{if(activeFilter!==-1&&a.doctor_id!==activeFilter)return;const h=parseInt(a.start_time?.substring(0,2));if(!isNaN(h))allHours.add(h);});
  slots.forEach(s=>{if(activeFilter!==-1&&s.doctor_id!==activeFilter)return;const h=parseInt(s.start_time?.substring(0,2));if(!isNaN(h))allHours.add(h);});
  if(allHours.size===0)for(let h=8;h<18;h++)allHours.add(h);
  const hours=Array.from(allHours).sort((a,b)=>a-b);
  const today=new Date().toDateString();
  const grid=document.getElementById('calGrid');
  grid.innerHTML='';

  const corner=document.createElement('div');corner.className='cal-head';corner.style.background='var(--surface2)';grid.appendChild(corner);
  days.forEach(day=>{
    const isT=day.toDateString()===today;
    const el=document.createElement('div');el.className='cal-head'+(isT?' today':'');
    el.innerHTML=DAYS_S[day.getDay()]+`<span class="day-num">${day.getDate()}</span>`;
    grid.appendChild(el);
  });

  hours.forEach(hour=>{
    const tl=document.createElement('div');tl.className='time-label';tl.textContent=String(hour).padStart(2,'0')+':00';grid.appendChild(tl);
    days.forEach(day=>{
      const ds=day.toISOString().split('T')[0];
      const cell=document.createElement('div');
      const appt=appointments.find(a=>{
        if(activeFilter!==-1&&a.doctor_id!==activeFilter)return false;
        return parseInt(a.start_time?.substring(0,2))===hour&&a.date===ds;
      });
      const slot=!appt&&slots.find(s=>{
        if(activeFilter!==-1&&s.doctor_id!==activeFilter)return false;
        return parseInt(s.start_time?.substring(0,2))===hour&&s.date===ds;
      });
      if(appt){
        const c=docColor(appt.doctors?.name);
        cell.className='cal-cell';cell.style.background=c;
        cell.innerHTML=`<div class="cell-inner cell-booked">${appt.patient_name?.split(' ')[0]||'Pacient'}<br><span style="opacity:0.8;font-size:8px">${appt.doctors?.name?.split(' ').slice(-1)[0]||''}</span></div>`;
        cell.addEventListener('click',()=>showModal(appt));
      } else if(slot){
        const c=docColor(slot.doctors?.name);
        cell.className='cal-cell';cell.style.borderLeft=`3px solid ${c}`;
        cell.innerHTML=`<div class="cell-inner cell-avail" style="color:${c}">Liber<br><span style="font-size:8px">${slot.doctors?.name?.split(' ').slice(-1)[0]||''}</span></div>`;
      } else {
        cell.className='cal-cell closed';
      }
      grid.appendChild(cell);
    });
  });
}

function showModal(a) {
  const c=docColor(a.doctors?.name);
  document.getElementById('modalTitle').textContent='Programare confirmată';
  document.getElementById('modalBody').innerHTML=`
    <div class="modal-doctor">
      <div class="doc-avatar" style="background:${c}">${docInitials(a.doctors?.name)}</div>
      <div><div class="doc-name">${a.doctors?.name||'Doctor'}</div><div class="doc-spec">${a.doctors?.specialty||''}</div></div>
    </div>
    <div class="modal-rows">
      <div class="modal-row"><span class="modal-label">Pacient</span><span class="modal-value">${a.patient_name||'—'}</span></div>
      <div class="modal-row"><span class="modal-label">Telefon</span><span class="modal-value">${a.patient_phone||'—'}</span></div>
      <div class="modal-row"><span class="modal-label">Serviciu</span><span class="modal-value">${a.services?.name||a.notes||'—'}</span></div>
      <div class="modal-row"><span class="modal-label">Durată</span><span class="modal-value">${a.services?.duration_min||'—'} minute</span></div>
      <div class="modal-row"><span class="modal-label">Data</span><span class="modal-value">${a.date||'—'}</span></div>
      <div class="modal-row"><span class="modal-label">Ora</span><span class="modal-value">${a.start_time?.substring(0,5)||'—'} – ${a.end_time?.substring(0,5)||'—'}</span></div>
      <div class="modal-row"><span class="modal-label">Preț</span><span class="modal-value modal-price">${a.services?.price_ron||'—'} RON</span></div>
      <div class="modal-row"><span class="modal-label">Status</span><span class="status-pill status-confirmed">Confirmat</span></div>
    </div>`;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){document.getElementById('modalOverlay').classList.remove('open');}
document.getElementById('modalOverlay').addEventListener('click',e=>{if(e.target===document.getElementById('modalOverlay'))closeModal();});
loadData();
setInterval(loadData,30000);
</script>
</body>
</html>
